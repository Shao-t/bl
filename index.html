<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京鐵塔 3D</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4ec;
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
    max-width: calc(100% - 20px); display: flex; flex-direction: column; gap: 8px; padding: 10px;
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.18); color: #1d2733; font-size: 13px; }
  #panel h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; border: 1px solid rgba(0,0,0,.18); background: #fff; color: inherit;
    border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 32px; }
  button.on { background: #e63e1a; border-color: #e63e1a; color: #fff; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; min-height: 32px; }
  #info { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom));
    max-width: min(560px, calc(100% - 24px)); padding: 8px 12px; border-radius: 10px; font-size: 13px;
    background: rgba(255,255,255,.88); color: #1d2733; box-shadow: 0 2px 12px rgba(0,0,0,.18);
    display: none; line-height: 1.5; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #1d2733; background: #9cc4ec; transition: opacity .4s; }
  @media (prefers-color-scheme: dark) {
    #panel, #info { background: rgba(28,34,44,.85); color: #e8edf3; }
    button { background: #2a3340; border-color: rgba(255,255,255,.2); }
    button.on { background: #e63e1a; border-color: #e63e1a; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <select id="modelSel"></select>
  <div class="row" id="views"></div>
  <div class="row" id="toggles">
    <button data-toggle="stairs" class="on">外階段</button>
    <button data-toggle="night">夜景</button>
    <button data-toggle="rotate" class="on">自動旋轉</button>
  </div>
</div>
<div id="info"></div>
<div id="loading">載入模型中…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';


// ---------------------------------------------------------------- renderer / scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const DAY = new THREE.Color('#9cc4ec'), NIGHT = new THREE.Color('#0b1226');
scene.background = DAY.clone();
scene.fog = new THREE.Fog(DAY.clone(), 900, 3200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x778877, 0.9);
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(300, 500, 200);
scene.add(hemi, sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(4000, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x8fa58a, roughness: 1, metalness: 0 })
);
ground.position.y = -0.05;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(40, 1, 1, 6000);
camera.position.set(360, 170, 360);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 160, 0);
controls.enableDamping = true;
controls.minDistance = 20;
controls.maxDistance = 1400;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- model
let tower = null;
const groups = {};
const info = document.getElementById('info');
const SRC_LABEL = { documented: '有依據', estimated: '估算' };

// 新增模型：在 models/ 放入 .glb，再於此加一筆。views 省略時自動產生「全景」
const MODELS = [
  { name: '東京鐵塔', file: 'models/tokyo-tower.glb', views: {
      '全景':       { pos: [360, 170, 360], tgt: [0, 160, 0] },
      '底部拱':     { pos: [135, 40, 135],  tgt: [0, 30, 0] },
      '外階段':     { pos: [60, 62, 235],   tgt: [0, 62, 0] },
      '主展望台':   { pos: [95, 130, 95],   tgt: [0, 125, 0] },
      '特別展望台': { pos: [60, 232, 60],   tgt: [0, 226, 0] },
  } },
];
let VIEWS = {};
const loader = new GLTFLoader();
const sel = document.getElementById('modelSel');
MODELS.forEach((m, i) => sel.add(new Option(m.name, i)));
sel.addEventListener('change', () => loadModel(MODELS[sel.value]));

function clearModel() {
  if (!tower) return;
  scene.remove(tower);
  tower.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach((mt) => mt.dispose());
  });
  tower = null;
  for (const k in groups) delete groups[k];
  info.style.display = 'none';
}

function buildViews(m) {
  VIEWS = m.views;
  if (!VIEWS) {
    const bb = new THREE.Box3().setFromObject(tower);
    const c = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length();
    VIEWS = { '全景': { pos: [c.x + r, c.y + r * 0.4, c.z + r], tgt: [c.x, c.y, c.z] } };
  }
  const box = document.getElementById('views');
  box.innerHTML = '';
  for (const k in VIEWS) {
    const b = document.createElement('button');
    b.textContent = k; b.dataset.view = k;
    box.appendChild(b);
  }
  flyTo(VIEWS[Object.keys(VIEWS)[0]], true);
}

function loadModel(m) {
  const ld = document.getElementById('loading');
  ld.style.opacity = 1; ld.textContent = '載入模型中…';
  if (!ld.isConnected) document.body.appendChild(ld);
  clearModel();
  loader.load(m.file, (gltf) => {
    tower = gltf.scene;
    tower.traverse((o) => {
      if (o.name && o.name.startsWith('G_')) groups[o.name] = o;
      if (o.isMesh && o.material) o.material.envMapIntensity = 0.45;
    });
    scene.add(tower);
    setNight(state.night);
    if (groups.G_Stairs) groups.G_Stairs.visible = state.stairs;
    document.querySelector('[data-toggle="stairs"]').style.display = groups.G_Stairs ? '' : 'none';
    buildViews(m);
    ld.style.opacity = 0;
    setTimeout(() => ld.remove(), 450);
  }, undefined, (err) => {
    ld.textContent = '模型載入失敗：' + (err && err.message ? err.message : err);
  });
}

// ---------------------------------------------------------------- UI: toggles
const state = { stairs: true, night: false, rotate: true };
function setNight(on) {
  state.night = on;
  const c = on ? NIGHT : DAY;
  scene.background.copy(c);
  scene.fog.color.copy(c);
  hemi.intensity = on ? 0.18 : 0.9;
  sun.intensity = on ? 0.15 : 1.8;
  ground.material.color.set(on ? 0x1d2a22 : 0x8fa58a);
  if (groups.G_NightLights) groups.G_NightLights.visible = on;
}
function setBtn(name, on) {
  document.querySelector(`[data-toggle="${name}"]`).classList.toggle('on', on);
}
document.getElementById('toggles').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.toggle;
  state[k] = !state[k];
  if (k === 'stairs' && groups.G_Stairs) groups.G_Stairs.visible = state.stairs;
  if (k === 'night') setNight(state.night);
  if (k === 'rotate') controls.autoRotate = state.rotate;
  setBtn(k, state[k]);
});

// ---------------------------------------------------------------- UI: camera views
let fly = null;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function flyTo(v, instant) {
  const p1 = new THREE.Vector3(...v.pos), t1 = new THREE.Vector3(...v.tgt);
  if (instant) { camera.position.copy(p1); controls.target.copy(t1); fly = null; return; }
  fly = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1, t1 };
  controls.autoRotate = false; state.rotate = false; setBtn('rotate', false);
}
document.getElementById('views').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  flyTo(VIEWS[b.dataset.view]);
});

// ---------------------------------------------------------------- click: show object name and data basis
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || !tower) return;
  const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]); down = null;
  if (moved > 5) return;
  ptr.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(tower, true).find((h) => h.object.visible);
  if (!hit) { info.style.display = 'none'; return; }
  const u = hit.object.userData || {};
  const src = SRC_LABEL[u.tt_source] || '—';
  info.innerHTML = `<b>${hit.object.name}</b>　資料依據：${src}` + (u.tt_note ? `<br><span style="opacity:.75">${u.tt_note}</span>` : '');
  info.style.display = 'block';
});

loadModel(MODELS[0]);

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.3);
    const k = ease(fly.t);
    camera.position.lerpVectors(fly.p0, fly.p1, k);
    controls.target.lerpVectors(fly.t0, fly.t1, k);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
